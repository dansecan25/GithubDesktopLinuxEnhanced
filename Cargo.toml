[package]
name = "github-desktop-enhanced"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A GitHub Desktop style git client for Linux, written in Rust"
repository = "https://github.com/dansecan25/GithubDesktopLinuxEnhanced"
readme = "README.md"
publish = false

[dependencies]
dirs = "7"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
keyring = "4.2"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
